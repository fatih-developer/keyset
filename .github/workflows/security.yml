name: Security and release candidate

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Static and dependency security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lifecycle scripts from repository/dependency content are not trusted in audit jobs.
      - run: npm ci --ignore-scripts
      - run: node scripts/security/secret-sentinel.mjs --scan
      - run: node --test scripts/security/*.test.mjs
      - run: npm audit --workspace=@key-set/cli --workspace=@key-set/core --workspace=@key-set/mcp --workspace=@key-set/provider-google --workspace=@key-set/google-automation --workspace=@key-set/sdk --workspace=@key-set/adapter-authjs --workspace=@key-set/adapter-better-auth --omit=dev --audit-level=high --ignore-scripts
      - run: npm run build
      - run: node scripts/security/package-audit.mjs

  release-candidate:
    name: Release candidate / Node ${{ matrix.node-version }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [22, 24]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/matrix/run.mjs --runtime
      - run: npm run test:packed
      - run: npm run build
      - run: node scripts/security/secret-sentinel.mjs --scan
      - run: node --test scripts/security/*.test.mjs
      - run: npm audit --workspace=@key-set/cli --workspace=@key-set/core --workspace=@key-set/mcp --workspace=@key-set/provider-google --workspace=@key-set/google-automation --workspace=@key-set/sdk --workspace=@key-set/adapter-authjs --workspace=@key-set/adapter-better-auth --omit=dev --audit-level=high --ignore-scripts
      - run: node scripts/security/package-audit.mjs
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application --omit=dev > sbom.cdx.json
      - name: Upload release audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyset-release-audit-node-${{ matrix.node-version }}
          path: sbom.cdx.json
          if-no-files-found: error
